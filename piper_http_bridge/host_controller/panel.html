<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piper 机械臂控制面板</title>
<style>
  :root{
    --bg:#0f1418; --card:#1a2129; --card2:#222b35; --line:#2e3947;
    --txt:#e6edf3; --dim:#8b98a8; --acc:#3fb950; --acc2:#1f6feb;
    --warn:#d29922; --danger:#f85149; --key:#2d333b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       -webkit-user-select:none;user-select:none}
  header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:600}
  .pill{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--card2);
        border:1px solid var(--line)}
  .pill.on{background:#12351a;color:var(--acc);border-color:var(--acc)}
  .pill.off{background:#3a1d1d;color:var(--danger);border-color:var(--danger)}
  .pill.mode{background:#13233a;color:#7db4ff;border-color:var(--acc2)}
  .kbd{display:inline-block;min-width:24px;text-align:center;padding:2px 6px;
       background:var(--key);border:1px solid var(--line);border-bottom-width:3px;
       border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;color:var(--txt)}
  .wrap{display:grid;grid-template-columns:330px 1fr 300px;gap:14px;padding:14px}
  @media(max-width:1150px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px;margin-bottom:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.5px;font-weight:600}
  .pad{display:grid;grid-template-columns:repeat(3,74px);grid-auto-rows:48px;gap:8px;
       justify-content:center}
  .pad button,.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);
       border-radius:8px;font-size:15px;cursor:pointer;transition:background .06s,transform .06s}
  .pad button:hover,.btn:hover{border-color:var(--acc2)}
  .pad button:active,.btn:active,.btn.press,.pad button.press{background:var(--acc2);
       transform:scale(.95)}
  .pad .lbl{font-size:10px;color:var(--dim);display:block;margin-top:2px}
  .btn{padding:10px 14px;font-size:14px}
  .btn.block{display:block;width:100%;margin-bottom:8px}
  .btn.green{background:#12351a;border-color:var(--acc);color:var(--acc)}
  .btn.red{background:#3a1d1d;border-color:var(--danger);color:var(--danger)}
  .btn.amber{background:#3a2f10;border-color:var(--warn);color:var(--warn)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card2);border:none;color:var(--dim);padding:8px 12px;
       cursor:pointer;font-size:13px}
  .seg button.on{background:var(--acc2);color:#fff}
  .state{font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap}
  .joint{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .joint .name{width:40px;font-size:13px;color:var(--dim)}
  .joint .val{width:64px;font-family:ui-monospace,monospace;font-size:12px;text-align:right}
  .joint button{flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);
       border-radius:6px;padding:9px 0;cursor:pointer}
  .joint button:active,.joint button.press{background:var(--acc2)}
  .muted{color:var(--dim);font-size:12px;line-height:1.6}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
       background:#3a1d1d;border:1px solid var(--danger);color:#ffb3ad;
       padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:99;max-width:80vw}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--dim)}
  .legend div{display:flex;align-items:center;gap:6px}
  h3.sub{font-size:11px;color:var(--dim);margin:14px 0 8px;font-weight:600}
  #cam,#camRtc{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9;object-fit:cover;
       border:1px solid var(--line)}
  input[type=range]{width:100%;accent-color:var(--acc2);cursor:pointer}
  input[type=number]{width:76px;background:var(--card2);color:var(--txt);
       border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:14px;
       font-family:ui-monospace,monospace;text-align:right}
  .joint input[type=number],#gripStep{width:56px;padding:6px 4px;font-size:12px}
  .flash{outline:2px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>
  <h1>🦾 Piper 机械臂控制面板</h1>
  <span id="conn" class="pill">连接中…</span>
  <span id="en" class="pill">未知</span>
  <span id="mode" class="pill mode" title="move 模式">模式 —</span>
  <span style="flex:1"></span>
  <span class="muted">每个关节 / 夹爪 各有独立步长</span>
</header>

<div class="wrap">
  <!-- 左:夹爪 + 摄像头 -->
  <div>
    <div class="card">
      <h2>夹爪</h2>
      <div class="row">
        <button class="btn" id="gClose" style="flex:1"><span class="kbd">G</span> 合抓</button>
        <button class="btn" id="gOpen" style="flex:1"><span class="kbd">H</span> 放开</button>
      </div>
      <input type="range" id="grip" min="0" max="80" step="1" value="0">
      <div class="muted" style="text-align:center">实际开度 <b id="gripVal">0</b> mm</div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <span class="muted">步长</span>
        <input type="number" id="gripStep" min="0.5" max="80" step="0.5" value="10"> mm
      </div>
    </div>

    <div class="card" id="camCard" style="display:none">
      <h2>摄像头 <span id="camMode" class="muted" style="text-transform:none"></span></h2>
      <video id="camRtc" autoplay muted playsinline style="display:none"></video>
      <img id="cam" alt="camera stream">
      <div class="muted" style="margin-top:6px">
        <a id="camOpen" href="#" target="_blank" rel="noopener" style="color:#7db4ff">新窗口打开</a>
      </div>
    </div>
  </div>

  <!-- 中:模式 + 状态 -->
  <div>
    <div class="card">
      <h2>模式 / 安全</h2>
      <button class="btn block green" id="btnEnable">使能机械臂</button>
      <button class="btn block amber" id="btnZero">回零位</button>
      <button class="btn block" id="btnDisable">失能</button>
      <button class="btn block red" id="btnStop">⛔ 急停</button>
    </div>
    <div class="card">
      <h2>实时状态</h2>
      <div class="state" id="state">—</div>
    </div>
  </div>

  <!-- 右:关节点动 + 说明 -->
  <div>
    <div class="card">
      <h2>关节点动（按轴 · 右侧为各轴步长°）</h2>
      <div id="joints"></div>
    </div>
    <div class="card">
      <h2>按键说明</h2>
      <div class="legend">
        <div><span class="kbd">1</span>/<span class="kbd">2</span> J1 −/+</div>
        <div><span class="kbd">3</span>/<span class="kbd">4</span> J2 −/+</div>
        <div><span class="kbd">5</span>/<span class="kbd">6</span> J3 −/+</div>
        <div><span class="kbd">7</span>/<span class="kbd">8</span> J4 −/+</div>
        <div><span class="kbd">9</span>/<span class="kbd">0</span> J5 −/+</div>
        <div><span class="kbd">-</span>/<span class="kbd">=</span> J6 −/+</div>
        <div><span class="kbd">G</span> 合抓</div>
        <div><span class="kbd">H</span> 放开</div>
      </div>
      <p class="muted" style="margin-top:10px">提示：直接点动六个关节。按住按键/按钮可连续点动，松开即停。每个关节的步长（°）在各自右侧输入框单独设置；夹爪步长（mm）在夹爪卡片里。</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const CAMERA_URL = "__CAMERA_URL__";
const CAMERA_RTC_URL = "__CAMERA_WEBRTC_URL__";

// 步长为数字输入:每个关节一个(°),夹爪单独一个(mm)。
function _num(id, dflt){ const el=document.getElementById(id); if(!el) return dflt;
  const v=parseFloat(el.value); return (isFinite(v)&&v>0)?v:dflt; }
function jointStep(i){ return _num("js"+i, 3); }   // 关节 i 的步长(°)
function gripStep(){ return _num("gripStep", 10); } // 夹爪步长(mm)

// ---- 夹爪目标(命令侧) vs 实际(反馈侧) ----
let gripTarget = 0;        // 本地维护的目标值(命令)
let gripActual = 0;        // 机械臂反馈的实际值(用于渲染滑条)
let gripEditing = false;   // 用户正在拖滑条

// ---------- 网络 ----------
async function api(path, payload){
  try{
    const opt = payload ? {method:"POST",headers:{"Content-Type":"application/json"},
                           body:JSON.stringify(payload)} : {};
    const r = await fetch(path, opt);
    return await r.json();
  }catch(e){ return {ok:false, error:String(e)}; }
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2500);
}
function doCmd(payload){
  // 立即回显(见 flash),发送后静默;状态由轮询刷新
  return api("/api/"+payload.action, payload).then(r=>{
    if(r && r.ok===false) toast(r.error||"命令失败");
    return r;
  });
}

// ---------- 回显 ----------
function flash(el){ if(!el) return; el.classList.add("press");
  setTimeout(()=>el.classList.remove("press"),160); }
function flashKey(k){
  if(k==="g") return flash($("#gClose"));
  if(k==="h") return flash($("#gOpen"));
  const spec=KEYJ[k]; if(!spec) return;
  const btn=document.querySelector(`[data-joint="${spec.i}:${spec.d>0?"+1":"-1"}"]`);
  if(btn) flash(btn);
}

// ---------- 关节点动（按住连续，平滑流式） ----------
const JREP_MS=25;   // 按住时的重复率 ~40Hz -> 平滑
const _jj={i:null, d:0, timer:null};
function jointStepOnce(i,d){ doCmd({action:"joint_jog",index:i,delta:d*jointStep(i)}); }
function startJoint(i,d){
  const same=(_jj.i===i && _jj.d===d);
  _jj.i=i; _jj.d=d;
  if(_jj.timer==null){ _jj.timer=setInterval(()=>jointStepOnce(_jj.i,_jj.d),JREP_MS); }
  if(!same) jointStepOnce(i,d);       // 立即一拍,不等首个 interval
}
function stopJoint(){ _jj.i=null;
  if(_jj.timer!=null){ clearInterval(_jj.timer); _jj.timer=null; } }

// 键盘 -> 关节/方向(0-based 索引)
const KEYJ={"1":{i:0,d:-1},"2":{i:0,d:+1},
            "3":{i:1,d:-1},"4":{i:1,d:+1},
            "5":{i:2,d:-1},"6":{i:2,d:+1},
            "7":{i:3,d:-1},"8":{i:3,d:+1},
            "9":{i:4,d:-1},"0":{i:4,d:+1},
            "-":{i:5,d:-1},"=":{i:5,d:+1}};

// 键盘:按住连续,松开停止;不含 Space/Enter(避免与 Tab/按钮冲突)
const _keyHeld={};
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.target.tagName==="INPUT") return;      // 不干扰步长/滑条等输入
  if(e.repeat) return;
  if(k==="g"){ gripTo(gripActual-gripStep()); flashKey("g"); return; }
  if(k==="h"){ gripTo(gripActual+gripStep()); flashKey("h"); return; }
  const spec=KEYJ[k];
  if(spec){ flashKey(k); _keyHeld[k]=true; startJoint(spec.i,spec.d); }
});
document.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(KEYJ[k]){ delete _keyHeld[k];
    const still=Object.keys(_keyHeld).filter(x=>KEYJ[x]);
    if(still.length){ const s=KEYJ[still[still.length-1]]; startJoint(s.i,s.d); }
    else stopJoint();
  }
});
window.addEventListener("blur",()=>{ for(const k in _keyHeld) delete _keyHeld[k]; stopJoint(); });

// ---------- 夹爪 ----------
function gripTo(mm){
  // 目标值基于实际反馈推算,避免连续按键期间目标漂移/回跳
  gripTarget=Math.max(0,Math.min(80,mm));
  doCmd({action:"gripper", position_mm:gripTarget});
}
function gripHandler(btn,dir){
  let t=null;
  const stepOnce=()=>gripTo(gripActual+dir*gripStep());
  const start=e=>{e.preventDefault(); stepOnce(); flash(btn);
                  t=setInterval(stepOnce,140);};
  const stop=()=>{ if(t){clearInterval(t);t=null;} };
  btn.addEventListener("mousedown",start); btn.addEventListener("touchstart",start,{passive:false});
  btn.addEventListener("mouseup",stop); btn.addEventListener("mouseleave",stop);
  btn.addEventListener("touchend",stop);
}
gripHandler($("#gOpen"),+1);
gripHandler($("#gClose"),-1);
// 滑条:拖动时直接设目标;渲染值来自实际反馈(不在拖动时被覆盖)
$("#grip").addEventListener("input",e=>{ gripEditing=true; gripTo(Number(e.target.value)); });
$("#grip").addEventListener("change",()=>{ gripEditing=false; });

// ---------- 模式 ----------
$("#btnEnable").onclick =()=>{flash($("#btnEnable")); doCmd({action:"enable"});};
$("#btnDisable").onclick=()=>{flash($("#btnDisable")); doCmd({action:"disable"});};
$("#btnStop").onclick   =()=>{flash($("#btnStop")); doCmd({action:"stop"});};
$("#btnZero").onclick   =()=>{flash($("#btnZero")); doCmd({action:"go_zero"});};

// ---------- 关节点动 ----------
const JOINT_NAMES=["J1","J2","J3","J4","J5","J6"];
const JOINT_KEY=[["1","2"],["3","4"],["5","6"],["7","8"],["9","0"],["-","="]];
(function buildJoints(){
  const box=$("#joints");
  JOINT_NAMES.forEach((n,i)=>{
    const row=document.createElement("div"); row.className="joint";
    row.innerHTML=`<span class="name">${n}</span>
      <button data-joint="${i}:-1"><span class="kbd">${JOINT_KEY[i][0]}</span> −</button>
      <span class="val" id="jv${i}">—</span>
      <button data-joint="${i}:+1"><span class="kbd">${JOINT_KEY[i][1]}</span> +</button>
      <input type="number" id="js${i}" min="0.1" max="90" step="0.1" value="3" title="步长(°)">`;
    box.appendChild(row);
    row.querySelectorAll("button").forEach(b=>{
      const d=Number(b.dataset.joint.split(":")[1]);
      const start=e=>{e.preventDefault(); flash(b); startJoint(i,d);};
      const stop=()=>stopJoint();
      b.addEventListener("mousedown",start); b.addEventListener("touchstart",start,{passive:false});
      b.addEventListener("mouseup",stop); b.addEventListener("mouseleave",stop);
      b.addEventListener("touchend",stop);
    });
  });
})();

// ---------- 摄像头 ----------
// 低延迟首选 WebRTC(MediaMTX WHEP);未配置则用 MJPEG <img> 兜底。
(function initCam(){
  const card=$("#camCard"), img=$("#cam"), vid=$("#camRtc"),
        mode=$("#camMode"), open=$("#camOpen");
  if(!CAMERA_RTC_URL && !CAMERA_URL){ return; }        // 都没配 -> 隐藏卡片
  card.style.display="block";

  if(CAMERA_RTC_URL){
    // MediaMTX 把每个流的 WHEP 端点暴露在 /{path}/whep
    open.href = CAMERA_RTC_URL;
    startWhep(CAMERA_RTC_URL.replace(/\/+$/,"") + "/whep", vid, img, mode);
  }else{
    mode.textContent = "MJPEG";
    img.style.display="block"; vid.style.display="none";
    img.src = CAMERA_URL; open.href = CAMERA_URL;
  }

  async function startWhep(whepUrl, video, imgEl, modeEl){
    const pc = new RTCPeerConnection();
    pc.addTransceiver("video", {direction:"recvonly"});
    pc.addTransceiver("audio", {direction:"recvonly"});
    pc.ontrack = e => { video.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      modeEl.textContent = "WebRTC · " + s;
      if(s==="failed" || s==="closed"){ fallback("WebRTC 断开"); }
    };
    try{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const res = await fetch(whepUrl, {method:"POST",
        headers:{"Content-Type":"application/sdp"},
        body: offer.sdp});
      if(!res.ok) throw new Error("WHEP " + res.status);
      await pc.setRemoteDescription({type:"answer", sdp: await res.text()});
      video.style.display="block"; imgEl.style.display="none";
      modeEl.textContent = "WebRTC · 低延迟";
    }catch(err){
      console.warn("WebRTC failed:", err);
      fallback("WebRTC 不可用");
    }
    function fallback(reason){
      try{ pc.close(); }catch(e){}
      if(CAMERA_URL){                      // 回退到 MJPEG
        modeEl.textContent = "MJPEG · 已回退(" + reason + ")";
        video.style.display="none"; imgEl.style.display="block";
        imgEl.src = CAMERA_URL; open.href = CAMERA_URL;
      }else{
        modeEl.textContent = reason;
      }
    }
  }
})();

// ---------- 状态:WebSocket 推送(丝滑) + HTTP 轮询回退 ----------
function fmt(v,d=2){ return (v===null||v===undefined)?"—":Number(v).toFixed(d); }
const MODE_TXT={0:"MOVE P",1:"MOVE J",2:"MOVE L",3:"MOVE C"};
let _gotState=false;

function render(r){
  const conn=$("#conn"),en=$("#en"),mode=$("#mode");
  if(!r || r.ok===false){
    conn.textContent="未连接"; conn.className="pill off"; return false;
  }
  conn.textContent="已连接"; conn.className="pill on";
  const s=r.state||{};
  en.textContent=s.enabled?"已使能":"未使能";
  en.className="pill "+(s.enabled?"on":"off");
  const mm=(s.move_mode!==undefined&&s.move_mode!==null)?s.move_mode
          :(s.arm_status?s.arm_status.mode_feedback:null);
  mode.textContent="模式 "+(MODE_TXT[mm]||"—");
  const j=s.joints_deg||[]; const p=s.end_pose||{};
  j.forEach((v,i)=>{ const el=$("#jv"+i); if(el) el.textContent=fmt(v,1)+"°"; });
  // 滑条按实际反馈渲染(用户拖动中不覆盖)
  if(typeof s.gripper_mm==="number"){
    gripActual=s.gripper_mm; gripTarget=gripActual;   // 目标对齐实际,避免回跳
    $("#gripVal").textContent=Math.round(gripActual);
    if(!gripEditing) $("#grip").value=gripActual;
  }
  $("#state").textContent=
`关节(°)  ${j.map(v=>fmt(v,1)).join("  ")}
末端位置 X ${fmt(p.x,1)}  Y ${fmt(p.y,1)}  Z ${fmt(p.z,1)}  mm
末端姿态 R ${fmt(p.roll,1)}  P ${fmt(p.pitch,1)}  Y ${fmt(p.yaw,1)}  °
夹爪     ${fmt(s.gripper_mm,1)} mm
状态码   ctrl=${s.arm_status?s.arm_status.ctrl_mode:"—"}  err=${s.arm_status?s.arm_status.err_code:"—"}`;
  return true;
}

// HTTP 轮询回退(WS 建立前或失败时兜底)
async function pollOnce(){
  const r=await api("/api/state");
  if(r && r.ok){ _gotState=true; render(r); }
  else if(!_gotState){ $("#conn").textContent="未连接"; $("#conn").className="pill off"; }
}
let pollTimer=null;
function startPolling(){ if(!pollTimer) pollTimer=setInterval(pollOnce,800); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function connectWS(){
  let ws;
  try{ ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws"); }
  catch(e){ startPolling(); return; }
  ws.onopen=()=>{ stopPolling(); };
  ws.onmessage=ev=>{ _gotState=true;
    try{ render(JSON.parse(ev.data)); }catch(_){} };
  ws.onclose=()=>{ $("#conn").textContent="未连接"; $("#conn").className="pill off";
                   startPolling(); setTimeout(connectWS,1500); };
  ws.onerror=()=>{ try{ws.close();}catch(_){} };
}
connectWS();
startPolling();   // WS 接通前先用轮询,接通后自动停止
</script>
</body>
</html>
